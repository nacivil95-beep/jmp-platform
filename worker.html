<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>현장 위치 전송</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#0f1420;color:#e6e9f0;font:16px/1.5 "Noto Sans KR",sans-serif}
  .wrap{max-width:460px;margin:0 auto;padding:18px}
  h1{font-size:20px;margin:6px 0 2px}
  .sub{color:#8b96b0;font-size:13px;margin-bottom:14px}
  label{display:block;font-size:13px;color:#9fb0cf;margin:12px 0 4px}
  input,select{width:100%;padding:12px;font-size:16px;border-radius:8px;border:1px solid #33405f;background:#1a2336;color:#e6e9f0}
  .seg{display:flex;gap:8px}
  .seg button{flex:1;padding:12px;border-radius:8px;border:1px solid #33405f;background:#1a2336;color:#e6e9f0;font-size:16px}
  .seg button.on{background:#2563eb;border-color:#2563eb}
  .chk{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:#b7c0d6;margin:16px 0}
  .chk input{width:22px;height:22px;margin-top:2px;flex:none}
  .go{width:100%;padding:16px;font-size:18px;font-weight:700;border:0;border-radius:10px;background:#16a34a;color:#fff;margin-top:6px}
  .go.stop{background:#dc2626}
  .go:disabled{opacity:.45}
  .box{background:#1a2336;border-radius:10px;padding:12px;margin-top:14px;font-size:14px}
  .ok{color:#4ade80}.er{color:#f87171}.wn{color:#fbbf24;font-size:13px}
  .hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>📍 현장 위치 전송</h1>
  <div class="sub">진천메가플리스 · 인력/장비 위치 공유</div>

  <label>구분</label>
  <div class="seg"><button type="button" id="t-person" class="on">👷 인력</button><button type="button" id="t-equip">🚜 장비</button></div>

  <label id="l-name">이름</label>
  <input id="name" autocomplete="name" placeholder="홍길동">

  <div id="equipBox" class="hide">
    <label>장비 종류</label>
    <select id="eqtype"></select>
    <label>장비 번호/식별명</label>
    <input id="eqno" placeholder="예: #1, 12가3456">
  </div>

  <label>업체명</label>
  <input id="company" list="cl" placeholder="예: 한성건설">
  <datalist id="cl"></datalist>

  <label class="chk"><input type="checkbox" id="agree"><span>현장 안전관리 목적으로 내 위치가 관리자 화면에 실시간 공유되는 것에 동의합니다. (전송 중지 시 공유 종료)</span></label>

  <button class="go" id="go">위치 전송 시작</button>

  <div class="box" id="status">대기 중</div>
  <p class="wn">※ 이 화면을 <b>켜둔 상태</b>에서만 위치가 전송됩니다. 화면이 꺼지거나 다른 앱으로 이동하면 전송이 멈출 수 있어요. (화면 자동 꺼짐 방지를 시도합니다)</p>
</div>

<script src="liveConfig.js"></script>
<script>
(function () {
  var C = window.LIVE_CONFIG || {}, FB = C.firebase || {};
  var $ = function (i) { return document.getElementById(i); };
  var MIN_INTERVAL = 5000;           // 서버 전송 최소 간격(ms)
  var type = 'person', running = false, watchId = null, wake = null, lastSent = 0, ref = null, db = null;
  var lastPos = null, hb = null;
  var HEARTBEAT = 20000;             // 가만히 있어도 이 간격(ms)마다 마지막 위치를 다시 전송(살아있음 신호)

  var uid = localStorage.getItem('live_uid');
  if (!uid) { uid = 'u' + Math.random().toString(36).slice(2, 10); localStorage.setItem('live_uid', uid); }

  /* 선택지 / 저장값 복원 */
  (C.equipTypes || []).forEach(function (t) { var o = document.createElement('option'); o.textContent = t; $('eqtype').appendChild(o); });
  (C.companies || []).forEach(function (t) { var o = document.createElement('option'); o.value = t; $('cl').appendChild(o); });
  var saved = {}; try { saved = JSON.parse(localStorage.getItem('live_profile') || '{}'); } catch (e) {}
  if (saved.type) setType(saved.type);
  ['name', 'company', 'eqno'].forEach(function (k) { if (saved[k]) $(k).value = saved[k]; });
  if (saved.eqtype) $('eqtype').value = saved.eqtype;

  function setType(t) {
    type = t;
    $('t-person').classList.toggle('on', t === 'person');
    $('t-equip').classList.toggle('on', t === 'equip');
    $('equipBox').classList.toggle('hide', t !== 'equip');
    $('l-name').textContent = t === 'equip' ? '운전원 이름' : '이름';
  }
  $('t-person').onclick = function () { if (!running) setType('person'); };
  $('t-equip').onclick = function () { if (!running) setType('equip'); };

  function msg(html, cls) { $('status').innerHTML = '<span class="' + (cls || '') + '">' + html + '</span>'; }
  function loadScript(src) {
    return new Promise(function (res, rej) {
      var s = document.createElement('script'); s.src = src; s.onload = res;
      s.onerror = function () { rej(new Error('로드 실패')); }; document.head.appendChild(s);
    });
  }

  async function ensureDb() {
    if (db) return;
    if (!FB.databaseURL) throw new Error('liveConfig.js 에 Firebase 설정이 비어 있습니다 (데모 모드에서는 전송 불가).');
    var base = 'https://www.gstatic.com/firebasejs/10.12.2/';
    await loadScript(base + 'firebase-app-compat.js');
    await loadScript(base + 'firebase-database-compat.js');
    if (!firebase.apps.length) firebase.initializeApp(FB);
    db = firebase.database();
  }

  async function requestWake() {
    try { if ('wakeLock' in navigator) { wake = await navigator.wakeLock.request('screen'); } } catch (e) {}
  }
  document.addEventListener('visibilitychange', function () {
    if (running && document.visibilityState === 'visible') {
      requestWake();
      if (lastPos) send(lastPos);    // 화면으로 돌아오면 즉시 한 번 더 전송
    }
  });

  function send(pos) {
    lastPos = pos;                   // 마지막으로 받은 위치를 기억(살아있음 신호용)
    var t = Date.now();
    if (t - lastSent < MIN_INTERVAL) return;
    lastSent = t;
    var p = {
      type: type,
      name: $('name').value.trim(),
      company: $('company').value.trim(),
      lat: pos.coords.latitude, lng: pos.coords.longitude,
      acc: Math.round(pos.coords.accuracy || 0),
      ts: firebase.database.ServerValue.TIMESTAMP
    };
    if (type === 'equip') p.label = ($('eqtype').value + ' ' + $('eqno').value.trim()).trim();
    ref.set(p).then(function () {
      var d = new Date();
      msg('✅ 전송 중 · 마지막 ' + d.toLocaleTimeString('ko-KR') + '<br>위치 정확도 ±' + p.acc + 'm' +
          (p.acc > 50 ? '<br><span class="wn">정확도가 낮습니다. 하늘이 트인 곳에서 더 정확해요.</span>' : ''), 'ok');
    }).catch(function (e) { msg('전송 실패: ' + e.message, 'er'); });
  }

  async function start() {
    if (!$('name').value.trim()) return msg('이름을 입력해 주세요.', 'er');
    if (type === 'equip' && !$('eqno').value.trim()) return msg('장비 번호/식별명을 입력해 주세요.', 'er');
    if (!$('agree').checked) return msg('위치 공유 동의에 체크해 주세요.', 'er');
    if (!navigator.geolocation) return msg('이 브라우저는 위치 기능을 지원하지 않습니다.', 'er');
    try { await ensureDb(); } catch (e) { return msg(e.message, 'er'); }

    localStorage.setItem('live_profile', JSON.stringify({
      type: type, name: $('name').value, company: $('company').value, eqno: $('eqno').value, eqtype: $('eqtype').value
    }));
    ref = db.ref((C.path || 'positions') + '/' + uid);
    running = true; lastSent = 0;
    $('go').textContent = '전송 중지'; $('go').classList.add('stop');
    msg('위치 확인 중… (위치 권한을 허용해 주세요)');
    requestWake();
    watchId = navigator.geolocation.watchPosition(send, function (err) {
      var m = { 1: '위치 권한이 거부되었습니다. 브라우저 설정에서 허용해 주세요.', 2: '위치를 가져올 수 없습니다.', 3: '위치 확인 시간이 초과되었습니다.' }[err.code] || err.message;
      msg(m, 'er');
    }, { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
    // 폰은 위치가 "바뀔 때만" 알려주므로, 가만히 서 있으면 전송이 끊긴 것처럼 보임 → 주기적으로 마지막 위치를 다시 보냄
    hb = setInterval(function () {
      if (running && lastPos && Date.now() - lastSent >= HEARTBEAT) send(lastPos);
    }, 5000);
  }

  function stop() {
    running = false;
    if (watchId != null) navigator.geolocation.clearWatch(watchId);
    watchId = null;
    if (hb) { clearInterval(hb); hb = null; }
    lastPos = null;
    if (wake) { try { wake.release(); } catch (e) {} wake = null; }
    if (ref) ref.remove();
    $('go').textContent = '위치 전송 시작'; $('go').classList.remove('stop');
    msg('전송을 중지했습니다. 지도에서 내 표시가 제거됩니다.');
  }

  $('go').onclick = function () { running ? stop() : start(); };
  window.addEventListener('pagehide', function () { /* 닫힌 경우: 마지막 위치는 '신호없음'으로 남았다가 자동 숨김 */ });
})();
</script>
</body>
</html>
